name: Security and Regression Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Node test suite
        run: |
          node --test tests/*.test.mjs

      - name: Run all Python regression tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify clean build and release package
        run: |
          python3 scripts/build-plugin.py
          test -f dist/codex-liquid-glass-1.0.1.zip
          test -f dist/codex-liquid-glass-1.0.1.zip.sha256
          (cd dist && shasum -a 256 -c codex-liquid-glass-1.0.1.zip.sha256)
